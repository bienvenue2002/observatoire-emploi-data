name: Publier Horizon MSI sur GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vérifier le pipeline et le JavaScript
        run: |
          python -m unittest discover -s tests -v
          node --check site/app.js
      - uses: actions/configure-pages@v5
      - name: Préparer uniquement les fichiers publics du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
