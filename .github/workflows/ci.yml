name: Tests Python et intégrité du site
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: node --check site/app.js && node tests/test_i18n.cjs
      - name: Vérifier les fichiers de données
        run: |
          python -c "import json; p=json.load(open('site/data/jobs.json')); assert p['jobs']; assert len(p['jobs']) == p['meta']['unique_offers']; assert len({j['id'] for j in p['jobs']}) == len(p['jobs']); assert all(j['observed_at'] and j['source_url'] for j in p['jobs'])"
